# FFN vendor-firmware policy.
#
# You may use firmware you own -- from your own appliance or your own media.
# FFN never ships it and never fetches it.
#
# autoimport: pick up matching firmware automatically when media is plugged in
# autoload  : also hand it to the loader (set to "no" to stage and confirm by hand)
#
# Note: the vendor manifest proves the files are INTACT, not that Palo Alto
# signed them. Set autoload=no if you want to inspect before anything is applied.
autoimport=yes
autoload=yes
