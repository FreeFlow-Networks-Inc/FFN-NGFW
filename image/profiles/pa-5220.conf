# PA-5220 ("Grangeville") build profile
#
# Sourced by ffn-pipeline.sh BEFORE config.sh, so every value here is a default
# that config.sh's ${VAR:-...} forms will honour, and that the caller can still
# override on the command line.
#
# Every value below was read off a live PA-5220 rather than assumed -- see the
# comments for what each one is pinned against.

FFN_MODEL="pa-5220"
# DMI product_name on this chassis. This is the reliable identifier: the board
# reports "Grangeville", not anything containing "5220".
FFN_MODEL_DMI="Grangeville"
# The 5220's firewall name. Also written to /etc/hostname and /etc/hosts
# by provision.sh, and it is the <hostname> in
# profiles/pa-5220.running-config.xml -- keep the two in step or the WebUI
# and the shell disagree about what the box is called.
FFN_HOSTNAME="PA-5220-FFN"

# ---- console -----------------------------------------------------------------
# The 5220 is headless and its BIOS console redirection runs at 9600. The
# generic config.sh default is 115200; booting an image built with that default
# gives an unreadable serial console on this box.
FFN_SERIAL_BAUD="9600"

# ---- management ---------------------------------------------------------------
# enp15s0 is the front mgmt port (PCI 0000:0f:00.0). enp16s0/enp17s0 are the two
# other ports of the same trio and must NOT be picked. Alphabetical "first NIC"
# selection is what previously chose the wrong port.
FFN_MGMT_IFACE="enp15s0"
# No default address: a distributed image must not come up on somebody else's
# management IP. Left empty, ffn-firstboot.sh configures the detected management
# NIC by DHCP. Supply both at build time to pin a static address, e.g.
#   FFN_MGMT_IP=10.0.0.5/24 FFN_MGMT_GW=10.0.0.1 ./build.sh
FFN_MGMT_IP="${FFN_MGMT_IP:-}"
FFN_MGMT_GW="${FFN_MGMT_GW:-}"
FFN_MGMT_DNS="${FFN_MGMT_DNS:-1.1.1.1}"

# ---- high-availability control ------------------------------------------------
# The three front RJ-45s are one I210 each and are NOT interchangeable:
#   0f:00.0 = MGT     (management)
#   10:00.0 = HA1-A   (HA control)
#   11:00.0 = HA1-B   (HA control, second link)
# Pinning them means HA1 defaults to a real HA port instead of whichever 1G port
# happened to enumerate first. The authoritative map lives in ffn_vendor.py's
# PLATFORMS table, keyed by PCI address so udev renaming cannot break it.
FFN_HA1_A="enp16s0"
FFN_HA1_B="enp17s0"

# ---- dataplane ----------------------------------------------------------------
# DELIBERATELY EMPTY on this model.
#
# 0b:00.0/.1 (enp11s0f0/f1) are AUX-1 / AUX-2 -- management-class 10G SFP+, not
# data ports. 08:00.0/.1 (enp8s0f0/f1) are the internal backplane link to the
# dataplane complex. So EVERY host-visible port here is management-class or
# internal: there is no correct host-side bump-in-the-wire on a PA-5200, and
# bridging AUX-1 to AUX-2 would join two management interfaces.
#
# The real data ports sit behind the Octeon III NPU. Until that dataplane runs,
# this model ships with no host forwarder. The AF_PACKET backend remains built
# and tested (octeon-dp/veth_test.sh) as a bring-up vehicle.
FFN_DP_PORTS=""
FFN_DP_MODE="octeon"

# Management-class 10G SFP+ pair, recorded so the WebUI can label them.
FFN_AUX_1="enp11s0f0"
FFN_AUX_2="enp11s0f1"

# ---- processor roles (PAN-OS vocabulary) ----------------------------------------
# Recovered from all 33 masterd grp_*.py files plus the vendor's own boot scripts
# /sbin/octeon and /opt/dpfs/sbin/octeon in the 5220 sysroot. Recorded here because
# FFN is PAN-OS-modeled, and FFN's own naming had one of these tiers wrong.
#
# masterd defines ten roles:
#     mp, cp, fpp, lp, lzp, lfp0, lfp1, dp0, dp1, dp2
#
#   mp   THE x86. Slot s0, hostname "mgmt", config /etc/masterd.d. Carries all 45
#        management AND control daemons -- routed, ikemgr, l3svc, ifmgr, l2ctrld
#        live here, not on "cp".
#   cp   An OCTEON, not the x86. Config /opt/dpfs/etc/masterd.d/cp/. No routing
#        daemons; its job is platform + supervisor + fpp, and booting the DPs. It
#        is a dataplane supervisor, not a control plane in the usual sense.
#   dp0  The dataplane Octeon. Config /opt/dpfs/etc/masterd.d/ (top level).
#
# So: x86 = mp. FFN_CP_* / ffn_cpdp naming calls the x86 the control plane, which
# does not match PAN. The transport ABI keeps its name for now -- renaming a live
# ABI is churn, not correctness -- but anywhere FFN mirrors PAN structure (sysd
# node names like md.apps.s0.mp.*, hw.s1.dp0.cpuinfo, role strings, HA and slot
# modeling) the x86 is "mp".
#
# masterd is ONE supervision tree across all three processors: a child's root group
# names its parent on another CPU via parent-role / parent-location /
# parent-hostname, and connUp_event arms the parent heartbeat before self-starting.
# Cross-CPU groups use hb max 9 / delay 30. Recovery is owned one level up: every DP
# group sets restart-max 0, while the MP's data_plane allows 3 then reboots the box.
FFN_ROLE_THIS_HOST="mp"

# ---- the two Octeons -------------------------------------------------------------
# These are DIFFERENT PARTS, and mixing them up misattributes DP capability to the
# chip FFN actually has running:
#
#              CP ("MP Octeon")                DP Octeon
#   script     /sbin/octeon                    /opt/dpfs/sbin/octeon
#   part       CN73XX or CN76XX                CN78XX
#   cores      numcores=8                      numcores=40 on PA-5220, 48 on others
#   u-boot     u-boot-gryphon_cp_pciboot.bin   u-boot-gryphon_dp{,_etch1}_pciboot.bin
#   vif        127.1.1.2 on pci0               127.1.2.2/.3.2/.4.2 on the CP's eth0-2
#   FPGA       /boot/fpga/ce40.bin @0x20000000  --
#
# Each tells the other what it is talking to: the DP gets board_rev ("is the CP 76xx
# or 73xx"), the CP gets cp_board_rev ("is the DP 78xx pass 1 or pass 2").
#
# THE OCTEON FFN BOOTS IS THE CP HALF (CN73XX, 8 cores, proc_id 0x000d9703).
# The 40-core figure in the DP grp_tasks.py FIPS table is the CN78XX, not this chip.
# A PA-5220 gets exactly one DP instance: cp/grp_data_plane.py returns for devnum>0.
FFN_OCTEON_CP_CORES="8"
FFN_OCTEON_DP_CORES="40"        # CN78XX on a genuine 5220; 48 on 5250/5260/5280

# The two addresses in FFN_OCTEON_PCI above are two FUNCTIONS of ONE device (bus 01,
# device 00), both 177d:9700 rev 03 with identical BAR layouts -- that is the CP.
# The DP Octeon is NOT on the x86 bus: the DP boot script runs on the *cp* role and
# reaches its DPs over the CP's own PCIe, behind a PLX PEX8606 whose out-of-order
# phy-port mapping the vendor corrects with a devmap. Whether a DP part is populated
# on this unit is unconfirmed.
FFN_OCTEON_DP_ON_HOST_BUS="no"

# ---- vendor artifacts: use in place, never package -------------------------------
# The FE100's packet parser is a compiled state machine and both halves already
# exist in the sysroot:
#     /opt/dpfs/usr/share/fe100/basic.bs   (source, symlinked as parser.bs)
#     /opt/dpfs/etc/fe-parser.json         (compiled pan_fe100_parse_table)
# masterd compiles the fe101 sibling at boot with
#     bsc --fe101 -o /etc/fe-parser.json /usr/share/fe101/parser.bs
# bsc itself is not in the sysroot, but the compiled table is. VENDOR CONTENT:
# usable in place on a box that already has it, never copied into an FFN image.
FFN_FE100_PARSER_TABLE="/opt/dpfs/etc/fe-parser.json"   # never packaged


# Octeon III CN73XX offload NPU. Two MIPS functions plus an NVMe-class function.
# OCTEON generation: III (CN73XX), possibly with OCTEON II compatibility.
#
# This was recorded as II for a while, on the strength of PAN's package
# naming: every PA-5200 dataplane package is oct2/.5200.mips64 and the DP
# kernel is vmlinux-3.10.87-oct2-dp. That was the wrong call, and the
# vendor's own board description says so -- the device trees embedded in
# BOTH bootloaders (u-boot-gryphon_cp_pciboot.bin and _dp_) describe
# OCTEON III blocks throughout:
#
#   compatible = "cavium,tb7600"          (root)
#   cavium,octeon-7890-ciu3               (interrupt controller)
#   cavium,octeon-7890-bgx / -bgx-port    (MACs)
#   cavium,octeon-7890-twsi / -gpio / -mmc
#
# CIU3 and BGX exist only on CN70XX/73XX/78XX. A hardware description the
# vendor ships and boots against outranks a filename, and it agrees with
# lspci's 177d:9700 = CN73XX.
#
# So "-oct2-" in PAN's names is their own label -- board revision, or the
# Octeon *instance* -- not the chip generation. FFN keeps its OCTEON-II
# backend compiled and available, because CN73XX retains compatibility for
# some blocks and the vendor evidently built their DP that way.
#
# Written to /etc/ffn-ngfw/octeon-gen, which is what the C dataplane reads
# to pick a backend (III = PKI/SSO/PKO3 with FPA3 auras; II = IPD/POW/PKO
# with FPA pools) -- it no longer guesses from the PCI id.
FFN_OCTEON_GEN="3"

FFN_OCTEON_IDS="177d:9700"
FFN_OCTEON_PCI="0000:01:00.0 0000:01:00.1"
FFN_OCTEON_BIND="vfio-pci"

# DPDK is not used on this model -- it was for x86 CPU-side processing. The
# dataplane here is AF_PACKET now and the Octeon later. Kept available but not
# required, so a DPDK build failure must not block a 5220 image.
FFN_NEED_DPDK="no"

# ---- disk ----------------------------------------------------------------------
# Matches the SSD the appliance boots today: p1 ffn-root (24G), p2 ffn-recovery.
IMG_SIZE_GB="32"
IMG_P1_END="24GiB"

# ---- kernel ---------------------------------------------------------------------
# IOMMU on is required for the vfio-pci bind of the Octeon.
GRUB_CMDLINE_DEFAULT="intel_iommu=on iommu=pt default_hugepagesz=2M hugepagesz=2M hugepages=512 transparent_hugepage=never"

# ---- watchdog --------------------------------------------------------------------
# This chassis exposes NO /dev/watchdog: iTCO_wdt loads but registers no device
# (vendor-support=0), so ffn-watchdogd correctly declines to start. The real
# hardware watchdog is the PAN CPLD device.
#
# That module is VENDOR code. It may be harvested and loaded in place on a box
# that already has it, but it must never be packaged into a distributed FFN
# image -- that would be redistribution. So: off by default, and opt-in only for
# a local build that is staying on one machine.
FFN_CPLD_WDT="${FFN_CPLD_WDT:-no}"     # yes = harvest+install locally, never ship

# ---- services to enable ------------------------------------------------------------
# ffn-dp-afpacket is intentionally ABSENT: with FFN_DP_PORTS empty this model
# ships no host forwarder, so requiring the unit would contradict the
# dataplane section above.
FFN_UNITS_ENABLE="ffn-manager-v2 ffn-configd ffn-controld ffn-bmfw ffn-sysd \
ffn-satd ffn-watchdogd ffn-firstboot ffn-selftest"
